<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">Bindaas BLR favicon</title>
  <desc id="desc">Black square favicon with silver B and BLR text inspired by the Bindaas BLR wordmark.</desc>
  <defs>
    <linearGradient id="silver" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f5f5f5" />
      <stop offset="45%" stop-color="#d4d4d8" />
      <stop offset="100%" stop-color="#71717a" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#000000" flood-opacity="0.55" />
    </filter>
  </defs>
  <rect width="512" height="512" rx="108" fill="#050505" />
  <text
    x="256"
    y="240"
    text-anchor="middle"
    font-family="Georgia, 'Times New Roman', serif"
    font-size="250"
    font-style="italic"
    fill="url(#silver)"
    filter="url(#shadow)"
  >
    B
  </text>
  <text
    x="256"
    y="390"
    text-anchor="middle"
    font-family="Arial, Helvetica, sans-serif"
    font-size="92"
    font-weight="700"
    letter-spacing="8"
    fill="url(#silver)"
  >
    BLR
  </text>
</svg>
